<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GlanceHold Bridge Preferences</title>
  </head>
  <body>
    <div class="pref-section">
      <label for="bridge-token">Bridge token</label>
      <input
        id="bridge-token"
        type="text"
        data-pref-key="bridgeToken"
        autocomplete="off"
        spellcheck="false"
        style="width: 100%; margin-top: 2px"
      />
      <p class="small secondary pref-help">
        Paste the per-install token generated by GlanceHold. Keep this value private.
      </p>
    </div>
  </body>
</html>
